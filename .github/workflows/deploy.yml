name: Deploy documentation to GitHub Pages

on:
  # Publish the configured documentation branch.
  push:
    branches: ["main", "chore/tent-nds-validation"]
    paths:
      - 'docs/**'
      - 'docs/requirements-docs.txt'
      - '.github/workflows/deploy.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy job
  build-and-deploy:
    if: >-
      (github.repository == 'kvcache-ai/Mooncake' && github.ref_name == 'main') ||
      (github.repository == 'zhangjiale-zjl/Mooncake' &&
       github.ref_name == (vars.DOCS_PUBLISH_BRANCH || 'main'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          pip install -r docs/requirements-docs.txt

      - name: Restore download statistics
        uses: actions/cache@v4
        with:
          path: docs/source/_static/pypi-downloads.json
          key: pypi-downloads-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pypi-downloads-v1-

      - name: Refresh download statistics
        run: python docs/scripts/update_pypi_downloads.py

      - name: Build documentation
        env:
          MOONCAKE_DOCS_REPOSITORY: ${{ github.repository }}
          MOONCAKE_DOCS_BRANCH: ${{ github.ref_name }}
          MOONCAKE_DOCS_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          cd docs
          make clean
          make html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the build directory
          path: './docs/build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
